<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="card_maior.css">
    <title>Card Integrante</title>
</head>

<body>

    <article class="card-integrante">

        <button class="fechar">×</button>

        <div class="topo">

            <div class="foto-container">
                <img src="image/batman.webp" alt="Foto do Batman">
            </div>

            <div class="informacoes">
                <div>
                    <span>Cidade:</span>
                    <p>Porto Alegre</p>
                </div>

                <div>
                    <span>Experiência:</span>
                    <p>FullStack</p>
                </div>

                <div>
                    <span>Curiosidade:</span>
                    <p>Gosta de programação</p>
                </div>
            </div>

        </div>

        <div class="perfil">
            <h2>Batman</h2>
            <p>FullStack</p>
        </div>

        <div class="descricao">
            <p>
                Dev em formação na Residência FullStack 5.0
                pelo Instituto Eldorado com experiência em
                banco de dados, Java e front-end.
            </p>
        </div>

    </article>

</body>

</html>
